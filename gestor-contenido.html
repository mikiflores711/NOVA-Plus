<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gestor de contenido | NOVA+</title><style>
:root{--bg:#090e0c;--panel:#141a18;--panel2:#1d2522;--line:#33403b;--text:#f7faf8;--muted:#aeb9b4;--red:#e50914;--green:#39d98a;--yellow:#ffd43b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#111917,#090e0c 55%,#070807);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 22px;background:rgba(9,14,12,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.top h1{font-size:20px;margin:0}.spacer{flex:1}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel2);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:var(--red);border-color:var(--red)}.btn.success{background:#147a4a;border-color:#1e9c61}.btn.danger{background:#72202a}.btn.update{background:#0f6fca;border-color:#2187e5}.btn.link{background:#6b4bb8;border-color:#8868d8}.wrap{width:min(1280px,100%);margin:auto;padding:22px}.login{width:min(420px,calc(100% - 32px));margin:12vh auto;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0c1210;color:#fff;margin:6px 0 14px}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}.panel-head{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.list{max-height:calc(100vh - 180px);overflow:auto}.item{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:54px 1fr;gap:11px}.item:hover,.item.active{background:var(--panel2)}.item img{width:54px;height:80px;object-fit:cover;border-radius:7px}.item strong{display:block}.item small{color:var(--muted)}.form{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.wide{grid-column:1/-1}.checkrow{display:flex;gap:20px;align-items:center;padding:10px 0}.search-results{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding:12px;background:#0c1210;border:1px solid var(--line);border-radius:12px}.result{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#101613;color:#fff;text-align:left;padding:8px;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}.result:hover,.result:focus-visible{background:var(--panel2);border-color:#5c7068;transform:translateY(-1px);outline:none}.result img{width:64px;height:96px;object-fit:cover;border-radius:7px;background:#202825}.result div{padding:0;min-width:0}.result strong{display:block;font-size:16px;line-height:1.25;margin-bottom:7px;white-space:normal}.result small{display:block;color:var(--muted);font-size:14px}.season{border:1px solid var(--line);border-radius:13px;margin:12px 0;overflow:hidden}.season summary{cursor:pointer;padding:13px;background:var(--panel2);font-weight:900}.episodes{padding:12px}.episode{display:grid;grid-template-columns:54px 60px minmax(160px,1fr) minmax(260px,2fr);gap:9px;align-items:center;margin-bottom:8px}.episode img{width:54px;height:34px;object-fit:cover;border-radius:5px}.episode input{margin:0}.status{min-height:22px;color:var(--yellow);margin:8px 0}.empty{padding:24px;color:var(--muted);text-align:center}@media(max-width:850px){.layout{grid-template-columns:1fr}.list{max-height:340px}.grid{grid-template-columns:1fr}.episode{grid-template-columns:44px 50px 1fr}.episode .video{grid-column:1/-1}.top{padding:11px}.wrap{padding:12px}}
</style></head><body>
<section id="login" class="login"><h1>Gestor de contenido</h1><p>Inicia sesión con las credenciales del administrador.</p><form id="loginForm"><input id="user" class="field" value="Admin" placeholder="Usuario"><input id="pass" class="field" type="password" placeholder="Contraseña"><button class="btn primary">Ingresar</button><p id="loginStatus" class="status"></p></form></section>
<section id="app" class="hidden"><header class="top"><h1>Gestor de contenido</h1><span class="spacer"></span><a class="btn" href="admin.html">Reportes</a><button id="newItem" class="btn primary">Agregar contenido</button><button id="logout" class="btn">Cerrar sesión</button></header><main class="wrap"><div class="layout"><aside class="panel"><div class="panel-head"><input id="filter" class="field" style="margin:0" placeholder="Buscar contenido..."></div><div id="contentList" class="list"></div><div style="padding:12px"><button id="importLocal" class="btn">Importar catálogo local</button></div></aside><section class="panel"><div class="panel-head"><strong id="formTitle">Nueva película</strong><span class="spacer"></span><button id="updateLinks" type="button" class="btn link hidden">Actualizar enlaces</button><button id="deleteItem" type="button" class="btn danger hidden">Eliminar</button></div><form id="contentForm" class="form"><div class="grid"><label>Tipo<select id="type" class="field"><option value="movie">Película</option><option value="tv">Serie</option></select></label><label>Buscar en información pública<div style="display:flex;gap:8px"><input id="tmdbQuery" class="field" style="margin-top:6px"><button id="tmdbSearch" type="button" class="btn">Buscar</button></div></label><div id="searchResults" class="search-results wide hidden"></div><label>ID interno<input id="contentId" class="field" required placeholder="nombre-2026"></label><label>ID de información<input id="tmdbId" class="field" type="number" required></label><label>Título<input id="title" class="field" required></label><label>Año<input id="year" class="field" type="number"></label><label>Fecha de estreno<input id="releaseDate" class="field" type="date"></label><label class="wide">Géneros<input id="genre" class="field"></label><label class="wide">Descripción<textarea id="description" class="field" rows="4"></textarea></label><label>Poster<input id="poster" class="field" type="url"></label><label>Fondo<input id="backdrop" class="field" type="url"></label><label>Orden<input id="sortOrder" class="field" type="number" value="0"></label><div class="checkrow"><label><input id="featured" type="checkbox"> Recomendación</label><label><input id="published" type="checkbox" checked> Publicado</label></div><label id="movieVideoWrap" class="wide">Enlace MP4<input id="movieVideo" class="field" type="url" placeholder="https://archive.org/...mp4"></label><section id="seriesEditor" class="wide hidden"><div style="display:flex;gap:8px;align-items:center"><h3 style="flex:1">Temporadas y episodios</h3><button id="loadSeasons" type="button" class="btn">Cargar temporadas</button></div><div id="seasonList"></div></section></div><p id="formStatus" class="status"></p><button id="saveItem" class="btn success">Guardar contenido</button></form></section></div></main></section>
<script src="assets/js/config.js"></script><script src="assets/js/content-data.js"></script><script>
const API=String(window.WMP_CONFIG?.reportApiUrl||'').replace(/\/$/,'');const KEY=window.WMP_CONFIG?.tmdbApiKey;const IMG='https://image.tmdb.org/t/p/';const $=s=>document.querySelector(s);let token=sessionStorage.getItem('wmp_admin_token')||'',items=[],editing=null,seasonData={};
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers});let j={};try{j=await r.json()}catch{}if(!r.ok||j.ok===false)throw new Error(j.error||'Error de conexión');return j}async function tmdb(path){const sep=path.includes('?')?'&':'?';const r=await fetch('https://api.themoviedb.org/3/'+path+sep+'api_key='+encodeURIComponent(KEY)+'&language=es-MX');if(!r.ok)throw new Error('No se pudo consultar la información.');return r.json()}
function slug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#user').value,password:$('#pass').value})});token=r.token;sessionStorage.setItem('wmp_admin_token',token);start()}catch(err){$('#loginStatus').textContent=err.message}};$('#logout').onclick=()=>{sessionStorage.removeItem('wmp_admin_token');location.reload()};
async function start(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await loadItems();resetForm()}async function loadItems(){const r=await api('/api/admin/content');items=r.items||[];renderList()}function renderList(){const q=$('#filter').value.toLowerCase();const list=items.filter(x=>`${x.title} ${x.year} ${x.id}`.toLowerCase().includes(q));$('#contentList').innerHTML=list.length?list.map(x=>`<div class="item ${editing?.id===x.id?'active':''}" data-id="${esc(x.id)}"><img src="${esc(x.poster||'')}" onerror="this.style.visibility='hidden'"><div><strong>${x.type==='tv'?'📺':'🎬'} ${esc(x.title)}</strong><small>${esc(x.year)} · ${x.published?'Publicado':'Oculto'}${x.featured?' · Recomendado':''}</small><small>${esc(x.id)}</small></div></div>`).join(''):'<div class="empty">No hay contenido en Cloudflare.</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>editItem(items.find(x=>x.id===el.dataset.id)))}$('#filter').oninput=renderList;
function resetForm(){editing=null;seasonData={};$('#contentForm').reset();$('#published').checked=true;$('#sortOrder').value=0;$('#formTitle').textContent='Nuevo contenido';$('#deleteItem').classList.add('hidden');$('#updateLinks').classList.add('hidden');$('#saveItem').textContent='Guardar contenido nuevo';$('#saveItem').className='btn success';$('#contentId').disabled=false;$('#seasonList').innerHTML='';$('#formStatus').textContent='';toggleType();renderList()}$('#newItem').onclick=resetForm;$('#type').onchange=toggleType;function toggleType(){$('#movieVideoWrap').classList.toggle('hidden',$('#type').value==='tv');$('#seriesEditor').classList.toggle('hidden',$('#type').value!=='tv')}
function editItem(x){editing=x;seasonData=JSON.parse(JSON.stringify(x.seasons||{}));$('#formTitle').textContent='Editar '+x.title;$('#deleteItem').classList.remove('hidden');$('#updateLinks').classList.remove('hidden');$('#saveItem').textContent=x.type==='tv'?'Actualizar serie':'Actualizar película';$('#saveItem').className='btn update';$('#type').value=x.type;$('#contentId').value=x.id;$('#contentId').disabled=true;$('#tmdbId').value=x.tmdbId;$('#title').value=x.title;$('#year').value=x.year;$('#releaseDate').value=x.releaseDate||'';$('#genre').value=x.genre||'';$('#description').value=x.description||'';$('#poster').value=x.poster||'';$('#backdrop').value=x.backdrop||'';$('#featured').checked=!!x.featured;$('#published').checked=x.published!==false;$('#sortOrder').value=x.sortOrder||0;$('#movieVideo').value=x.video||'';toggleType();renderSeasons();renderList()}
$('#tmdbSearch').onclick=async()=>{const q=$('#tmdbQuery').value.trim();if(!q)return;try{const kind=$('#type').value;const r=await tmdb(`search/${kind}?query=${encodeURIComponent(q)}&include_adult=false`);const box=$('#searchResults');box.classList.remove('hidden');box.innerHTML=(r.results||[]).slice(0,12).map(x=>`<button type="button" class="result" data-tmdb="${x.id}"><img src="${x.poster_path?IMG+'w185'+x.poster_path:''}" alt="Portada de ${esc(x.title||x.name)}" onerror="this.style.visibility='hidden'"><div><strong>${esc(x.title||x.name)}</strong><small>Año: ${esc((x.release_date||x.first_air_date||'Sin fecha').slice(0,4))}</small></div></button>`).join('');box.querySelectorAll('[data-tmdb]').forEach(b=>b.onclick=()=>selectTmdb(Number(b.dataset.tmdb)))}catch(e){$('#formStatus').textContent=e.message}};
async function selectTmdb(id){try{const kind=$('#type').value;const d=await tmdb(`${kind}/${id}?append_to_response=images&include_image_language=es,en,null`);$('#tmdbId').value=id;$('#title').value=d.title||d.name||'';const fullDate=(d.release_date||d.first_air_date||'').slice(0,10);const y=fullDate.slice(0,4);$('#year').value=y;$('#releaseDate').value=fullDate;$('#contentId').value=slug((d.title||d.name)+'-'+y);$('#genre').value=(d.genres||[]).map(g=>g.name).join(' · ');$('#description').value=d.overview||'';$('#poster').value=d.poster_path?IMG+'w500'+d.poster_path:'';$('#backdrop').value=d.backdrop_path?IMG+'original'+d.backdrop_path:'';$('#searchResults').classList.add('hidden');if(kind==='tv')await loadTmdbSeasons(d)}catch(e){$('#formStatus').textContent=e.message}}
$('#loadSeasons').onclick=async()=>{const id=Number($('#tmdbId').value);if(!id)return $('#formStatus').textContent='Selecciona primero una serie.';const d=await tmdb(`tv/${id}`);await loadTmdbSeasons(d)};async function loadTmdbSeasons(d){seasonData={};for(const s of (d.seasons||[]).filter(x=>x.season_number>0)){const sd=await tmdb(`tv/${d.id}/season/${s.season_number}`);seasonData[s.season_number]=(sd.episodes||[]).map(ep=>({episode:ep.episode_number,title:ep.name||'',overview:ep.overview||'',runtime:ep.runtime||0,still:ep.still_path?IMG+'w500'+ep.still_path:'',video:''}))}renderSeasons()}
function renderSeasons(){$('#seasonList').innerHTML=Object.entries(seasonData).map(([n,eps])=>`<details class="season" open><summary>Temporada ${n} · ${eps.length} episodios</summary><div class="episodes">${eps.map((ep,i)=>`<div class="episode"><img src="${esc(ep.still||'')}"><b>E${ep.episode||i+1}</b><input class="field" value="${esc(ep.title||'')}" data-s="${n}" data-i="${i}" data-k="title"><input class="field video" type="url" placeholder="Enlace MP4 del episodio" value="${esc(typeof ep==='string'?ep:(ep.video||''))}" data-s="${n}" data-i="${i}" data-k="video"></div>`).join('')}</div></details>`).join('');document.querySelectorAll('[data-s]').forEach(inp=>inp.oninput=()=>{const ep=seasonData[inp.dataset.s][Number(inp.dataset.i)];if(typeof ep==='string')seasonData[inp.dataset.s][Number(inp.dataset.i)]={episode:Number(inp.dataset.i)+1,title:'',overview:'',runtime:0,still:'',video:ep};seasonData[inp.dataset.s][Number(inp.dataset.i)][inp.dataset.k]=inp.value})}
$('#updateLinks').onclick=()=>{
  if(!editing)return;
  if($('#type').value==='movie'){
    $('#movieVideo').scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>$('#movieVideo').focus(),350);
    $('#formStatus').textContent='Pega el enlace MP4 nuevo y pulsa “Actualizar película”.';
  }else{
    $('#seriesEditor').scrollIntoView({behavior:'smooth',block:'start'});
    const first=document.querySelector('#seasonList input.video');
    if(first)setTimeout(()=>first.focus(),350);
    $('#formStatus').textContent='Cambia el enlace del episodio correspondiente y pulsa “Actualizar serie”.';
  }
};
$('#contentForm').onsubmit=async e=>{e.preventDefault();const body={id:$('#contentId').value.trim(),type:$('#type').value,tmdbId:Number($('#tmdbId').value),title:$('#title').value.trim(),year:Number($('#year').value),releaseDate:$('#releaseDate').value,genre:$('#genre').value.trim(),description:$('#description').value.trim(),poster:$('#poster').value.trim(),backdrop:$('#backdrop').value.trim(),featured:$('#featured').checked,published:$('#published').checked,sortOrder:Number($('#sortOrder').value||0)};if(body.type==='movie')body.video=$('#movieVideo').value.trim();else body.seasons=seasonData;try{const path=editing?'/api/content/'+encodeURIComponent(editing.id):'/api/content';await api(path,{method:editing?'PUT':'POST',body:JSON.stringify(body)});$('#formStatus').textContent=editing?'Contenido actualizado correctamente. Los enlaces nuevos ya están activos.':'Contenido creado correctamente.';await loadItems();editItem(items.find(x=>x.id===body.id))}catch(err){$('#formStatus').textContent=err.message}};
$('#deleteItem').onclick=async()=>{if(!editing||!confirm('¿Eliminar '+editing.title+' del catálogo?'))return;try{await api('/api/content/'+encodeURIComponent(editing.id),{method:'DELETE'});await loadItems();resetForm()}catch(e){$('#formStatus').textContent=e.message}};
$('#importLocal').onclick=async()=>{if(!Array.isArray(window.WMP_CONTENT)||!window.WMP_CONTENT.length)return alert('No hay catálogo local.');if(!confirm('Esto importará Río y Loki a Cloudflare.'))return;try{const r=await api('/api/content/import',{method:'POST',body:JSON.stringify({items:window.WMP_CONTENT})});alert(`Importados: ${r.imported}. Errores: ${r.failed.length}`);await loadItems()}catch(e){alert(e.message)}};
if(token)start();
</script></body></html>
